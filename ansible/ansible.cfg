[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
roles_path = roles
stdout_callback = default
result_format = yaml
deprecation_warnings = False
# secrets.yml is ansible-vault encrypted; the key lives in this gitignored file
# (run playbooks from the ansible/ dir). Swap for `--ask-vault-pass` to avoid it.
vault_password_file = .vault-pass

[ssh_connection]
pipelining = True
