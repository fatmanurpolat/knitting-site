---
# Template for ansible/secrets.yml (which is gitignored — never commit real values).
# Copy this file to secrets.yml and fill in strong values, or encrypt secrets.yml
# with `ansible-vault encrypt` (vars_files loads a vaulted file transparently).
#
# playbook.yml loads these via `vars_files: - secrets.yml`.
#
# Generate strong values:
#   session_secret:  openssl rand -hex 32
#   db_password:     openssl rand -hex 24
#   admin_password:  a long passphrase you'll actually type

admin_password: "CHANGE-ME-a-strong-dashboard-password"
session_secret: "CHANGE-ME-run-openssl-rand-hex-32"
db_password: "CHANGE-ME-run-openssl-rand-hex-24"
