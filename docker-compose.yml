# Örgülog — app + Postgres.
#
#   ADMIN_PASSWORD=... SESSION_SECRET=... docker compose up -d --build
#
# Values default to dev-safe placeholders; override via a .env file or the shell.
# On first boot the app migrates the schema and seeds the catalog, loading each
# product photo from /public/images into the database (all product images live
# in Postgres from then on).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orgulog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orgulog_dev}
      POSTGRES_DB: orgulog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgulog -d orgulog"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://orgulog:${DB_PASSWORD:-orgulog_dev}@db:5432/orgulog
      # Public origin for absolute links (e.g. product URL in the WhatsApp order message).
      SITE_URL: ${SITE_URL:-}
      # Cloudflare Web Analytics beacon token (optional; empty = no analytics).
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      # Dashboard (single user). Required — compose refuses to start until set, so
      # a production `docker compose up` can never boot with a known password/secret.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (a strong dashboard password)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (>=32 random chars)}
      # Brand
      BRAND_NAME: ${BRAND_NAME:-Örgülog}
      BRAND_INSTAGRAM: ${BRAND_INSTAGRAM:-https://www.instagram.com/orgulog2/}
      BRAND_WHATSAPP: ${BRAND_WHATSAPP:-https://wa.me/905387277185}
      BRAND_EMAIL: ${BRAND_EMAIL:-hello@orgulog.example}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
